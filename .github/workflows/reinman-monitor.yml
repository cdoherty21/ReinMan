# Rein Man: race-day monitor. Ingests cards, scratches, changes and results; re-predicts
# changed races; locks; grades; refreshes stats. Dispatched every 15 minutes during racing
# hours by the Worker's cron (reliable clock); the schedule below is only a fallback.
name: reinman-monitor
on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 14-23,0-5 * * *"
concurrency:
  group: reinman-db-writer
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  monitor:
    # Scheduled runs stay off until the repository variable REINMAN_ENABLED is "true"
    # (set it once the racing-data secrets exist). Manual runs always work.
    if: github.event_name == 'workflow_dispatch' || vars.REINMAN_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: engine } }
    env:
      REINMAN_DB: d1
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      RACINGAPI_USERNAME: ${{ secrets.RACINGAPI_USERNAME }}
      RACINGAPI_PASSWORD: ${{ secrets.RACINGAPI_PASSWORD }}
      PUNTERSEDGE_API_KEY: ${{ secrets.PUNTERSEDGE_API_KEY }}
      NWS_USER_AGENT: ${{ vars.NWS_USER_AGENT || '(rein-man personal handicapping app)' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engine/pyproject.toml }
      - run: pip install -e .
      - run: reinman monitor
