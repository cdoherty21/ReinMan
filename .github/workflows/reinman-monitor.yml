# Rein Man: race-day monitor. Ingests cards, scratches, changes and results; re-predicts
# changed races; locks; grades; refreshes stats. Started by the Worker's 5-minute clock
# when the card calls for it (worker/src/schedule.ts: just before posts, a warm-up before
# the first race, results sweeps); the schedule below is only a fallback.
name: reinman-monitor
on:
  workflow_dispatch:
  # Backup only, in case the Worker's clock stops (GitHub's own schedule is unreliable).
  schedule:
    - cron: "52 */3 * * *"
concurrency:
  group: reinman-db-writer
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  monitor:
    # Scheduled runs stay off until the repository variable REINMAN_ENABLED is "true"
    # (set it once the racing-data secrets exist). Manual runs always work.
    if: github.event_name == 'workflow_dispatch' || vars.REINMAN_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: engine } }
    env:
      REINMAN_DB: d1
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      # Read-only use: today's account-wide D1 rows written (engine/reinman/quota.py).
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN || secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      PUNTERSEDGE_API_KEY: ${{ secrets.PUNTERSEDGE_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      REINMAN_NEWS_FEEDS: ${{ vars.REINMAN_NEWS_FEEDS }}
      OTB_DAILY_PAGES: ${{ vars.OTB_DAILY_PAGES || '60' }}
      OTB_MIN_INTERVAL_MIN: ${{ vars.OTB_MIN_INTERVAL_MIN || '60' }}
      NWS_USER_AGENT: ${{ vars.NWS_USER_AGENT || '(rein-man personal handicapping app)' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engine/pyproject.toml }
      - run: pip install -e .
      # The PDF/OCR tools take about a minute to install, so only when documents are waiting.
      - id: docs
        run: reinman documents-ready
      - if: steps.docs.outputs.ready != '0'
        run: (command -v pdftotext && command -v tesseract) || (sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr)
      - id: run
        run: reinman monitor
      # Alert: a failed step here emails the repository owner (GitHub's default
      # notification). It fires only when the day's D1 writes pass 85% of the free tier.
      - if: steps.run.outputs.quota_level == 'pause_bulk' || steps.run.outputs.quota_level == 'emergency'
        run: |
          echo "::error title=D1 write budget::${{ steps.run.outputs.quota_pct }}% of today's free-tier D1 writes used (${{ steps.run.outputs.quota_level }}). Essential writes only until 00:00 UTC; see docs/D1_BUDGET.md."
          exit 1

