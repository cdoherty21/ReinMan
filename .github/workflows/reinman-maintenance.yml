# One-off data maintenance commands against the live database. Manual only; each run
# should be recorded in docs/DATA_LOG.md.
name: reinman-maintenance
on:
  workflow_dispatch:
    inputs:
      command:
        description: Maintenance command to run
        type: choice
        options: [canonicalize-people]
concurrency:
  group: reinman-db-writer
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: engine } }
    env:
      REINMAN_DB: d1
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      # Read-only use: today's account-wide D1 rows written (engine/reinman/quota.py).
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN || secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      COMMAND: ${{ inputs.command }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engine/pyproject.toml }
      - run: pip install -e .
      - run: reinman "$COMMAND"
