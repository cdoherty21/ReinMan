name: reinman-documents
on:
  workflow_dispatch:
    inputs:
      rescan:
        description: Scan existing uploads again
        type: boolean
        default: false
  schedule:
    - cron: "17 * * * *"
concurrency:
  group: reinman-db-writer
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: engine } }
    env:
      REINMAN_DB: d1
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engine/pyproject.toml }
      - run: (command -v pdftotext && command -v tesseract) || (sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr)
      - run: pip install -e .
      - name: Import verified November 24 cards and reprocess the six partial extracts
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from reinman.db import connect
          from reinman.documents import _store_program_cards, process_queue
          from reinman.registry import ensure_baseline
          from reinman.predict import predict_date
          db = connect()
          ensure_baseline(db)
          cards = json.loads(Path('verified_2026_11_24_cards.json').read_text())
          assert len(cards) == 51 and all(c['meet']['race_date'] == '2026-11-24' for c in cards)
          imported, linked = _store_program_cards(db, cards)
          print('Complete cards imported:', len(imported), 'verified cards linked:', len(linked))
          names = ('finger-lakes.txt','parx-racing.txt','delta-downs.txt','mountaineer.txt','mahoning-valley.txt','zia-park.txt')
          for doc in db.query("SELECT id FROM documents WHERE lower(filename) IN (?,?,?,?,?,?) AND status='processed'", names):
              db.execute("DELETE FROM document_notes WHERE document_id=?", [doc['id']])
              db.execute("UPDATE documents SET status='pending', error=NULL WHERE id=?", [doc['id']])
          print('Rescan:', process_queue(db))
          scoped = {rid: ['verified race program'] for rid in linked}
          print('Upcoming picks:', predict_date(db, '2026-11-24', scoped, only_changed=True))
          for row in db.query("""SELECT filename, status, json_array_length(summary,'$.races_linked') AS linked_races,
                json_extract(summary,'$.horses_matched') AS matched_horses,
                json_extract(summary,'$.partial_conflicts') AS conflicting_races
                FROM documents WHERE lower(filename) IN (?,?,?,?,?,?) ORDER BY filename""", names):
              print(row)
          PY
