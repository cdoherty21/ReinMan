name: reinman-documents
on:
  workflow_dispatch:
    inputs:
      rescan:
        description: Scan existing uploads again
        type: boolean
        default: false
  schedule:
    - cron: "17 * * * *"
concurrency:
  group: reinman-upload-inspection
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: engine } }
    env:
      REINMAN_DB: d1
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engine/pyproject.toml }
      - name: Inspect uploaded extract rows
        run: |
          python - <<'PY'
          import json, os, urllib.request
          endpoint = 'https://api.cloudflare.com/client/v4/accounts/' + os.environ['CLOUDFLARE_ACCOUNT_ID'] + '/d1/database/' + os.environ['D1_DATABASE_ID'] + '/query'
          sql = "SELECT d.filename,c.text FROM documents d JOIN document_chunks c ON d.id=c.document_id WHERE d.id BETWEEN 3 AND 8 ORDER BY d.id,c.seq"
          req = urllib.request.Request(endpoint, data=json.dumps({'sql':sql}).encode(), headers={
              'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN'], 'Content-Type':'application/json'})
          with urllib.request.urlopen(req, timeout=20) as response:
              for row in json.load(response)['result'][0]['results']:
                  print(row['filename'], [line for line in row['text'].splitlines() if line.strip() and '://' not in line])
          PY
