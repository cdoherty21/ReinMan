name: reinman-documents
on:
  workflow_dispatch:
    inputs:
      rescan:
        description: Scan existing uploads again
        type: boolean
        default: false
  schedule:
    - cron: "17 * * * *"
concurrency:
  group: reinman-db-writer
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: engine } }
    env:
      REINMAN_DB: d1
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engine/pyproject.toml }
      - run: (command -v pdftotext && command -v tesseract) || (sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr)
      - run: pip install -e .
      - name: Inspect six unmatched racing files
        run: |
          python - <<'PY'
          from reinman.db import connect
          from reinman.documents import document_text
          from urllib.parse import urlsplit
          import re
          db = connect()
          filenames = ('finger-lakes.txt','parx-racing.txt','delta-downs.txt','mountaineer.txt','mahoning-valley.txt','zia-park.txt')
          docs = db.query("SELECT id,filename,summary FROM documents WHERE lower(filename) IN (?,?,?,?,?,?) ORDER BY id", filenames)
          for doc in docs:
              text = document_text(db, doc['id'])
              urls = [urlsplit(value) for value in re.findall(r'https?://[^\s<>]+', text)]
              print(doc['filename'], 'chars', len(text), 'lines', len(text.splitlines()), 'dates', re.findall(r'20\d\d-\d\d-\d\d|\d{1,2}/\d{1,2}/20\d{2}',text)[:8], 'url count', len(urls), 'source paths', sorted({(u.hostname,u.path) for u in urls})[:6])
              print('First lines:', [line[:100] for line in text.splitlines() if line.strip() and '://' not in line][:5])
          PY
