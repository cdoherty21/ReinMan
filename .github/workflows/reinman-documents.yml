name: reinman-documents
on:
  workflow_dispatch:
    inputs:
      rescan:
        description: Scan existing uploads again
        type: boolean
        default: false
  # The Worker starts a scan within 5 minutes of an upload; this is a backup.
  schedule:
    - cron: "17 */3 * * *"
concurrency:
  group: reinman-db-writer
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  scan:
    # Scheduled runs stay off until the repository variable REINMAN_ENABLED is "true".
    if: github.event_name == 'workflow_dispatch' || vars.REINMAN_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: engine } }
    env:
      REINMAN_DB: d1
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engine/pyproject.toml }
      - run: pip install -e .
      # The PDF/OCR tools take about a minute to install, so only when documents are waiting.
      - id: docs
        run: reinman documents-ready
      - if: steps.docs.outputs.ready != '0' || inputs.rescan == true
        run: (command -v pdftotext && command -v tesseract) || (sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr)
      - if: inputs.rescan == true
        run: reinman documents --rescan
      - if: inputs.rescan != true && steps.docs.outputs.ready != '0'
        run: reinman documents
