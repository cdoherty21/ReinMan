# Deploys the Worker + app after successful main-branch CI, or on manual request.
name: reinman-deploy
on:
  workflow_dispatch:
  workflow_run:
    workflows: [reinman-ci]
    branches: [main]
    types: [completed]
concurrency:
  group: reinman-production-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: . } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      - name: Verify production commit is current
        if: github.event_name == 'workflow_run'
        run: test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
      - name: Use the real D1 database id
        run: sed -i "s/00000000-0000-0000-0000-000000000000/${{ secrets.D1_DATABASE_ID }}/" worker/wrangler.jsonc
      - run: npm run db:migrate:remote
      - run: npm run deploy
      - name: Verify Stables production route and report coverage
        run: |
          curl --fail --silent --show-error --retry 3 https://rein-man.doherty-connor30.workers.dev/stables | grep -q 'Rein Man'
          curl --fail --silent --show-error --retry 3 https://rein-man.doherty-connor30.workers.dev/api/session | jq -e '.authenticated == false and .authRequired == true'
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://rein-man.doherty-connor30.workers.dev/api/stables)" = 401
          npx wrangler d1 execute rein-man --remote -c worker/wrangler.jsonc --command "SELECT (SELECT COUNT(DISTINCT horse_id) FROM runners) AS recorded_horses, (SELECT COUNT(*) FROM (SELECT horse_key FROM chart_lines UNION SELECT horse_key FROM historical_winners)) AS archive_name_keys, COUNT(CASE WHEN biography IS NOT NULL THEN 1 END) AS externally_verified FROM stable_enrichment;"
      - name: Check immediate document dispatch configuration
        run: |
          npx wrangler secret list -c worker/wrangler.jsonc | jq -r 'if any(.[]; .name == "GITHUB_TOKEN") then "Document dispatch token is configured." else "Document dispatch token is missing. Scheduled scans remain available." end'
