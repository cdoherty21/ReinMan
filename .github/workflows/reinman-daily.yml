# Rein Man: full daily cycle — yesterday's/today's results, today's and tomorrow's cards,
# predictions, locking, grading and performance statistics.
name: reinman-daily
on:
  workflow_dispatch:
  schedule:
    - cron: "41 10 * * *"   # ~6:41am ET
concurrency:
  group: reinman-db-writer
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults: { run: { working-directory: engine } }
    env:
      REINMAN_DB: d1
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      RACINGAPI_USERNAME: ${{ secrets.RACINGAPI_USERNAME }}
      RACINGAPI_PASSWORD: ${{ secrets.RACINGAPI_PASSWORD }}
      PUNTERSEDGE_API_KEY: ${{ secrets.PUNTERSEDGE_API_KEY }}
      NWS_USER_AGENT: ${{ vars.NWS_USER_AGENT || '(rein-man personal handicapping app)' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engine/pyproject.toml }
      - run: pip install -e .
      - run: reinman daily
