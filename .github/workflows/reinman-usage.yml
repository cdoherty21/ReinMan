# READ-ONLY: reports D1 rows written (Cloudflare analytics when the token allows it,
# plus Rein Man's own per-job counts). Writes nothing to the database.
name: reinman-usage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: engine } }
    env:
      REINMAN_DB: d1
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engine/pyproject.toml }
      - run: pip install -e .
      - run: reinman d1-usage
