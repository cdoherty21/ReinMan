name: reinman-ci
# Push runs only on main (a branch's commits are tested by its pull request, not twice).
# Docs and other workflows' files never change what these tests check.
on:
  push:
    branches: [main]
    paths: ["engine/**", "web/**", "worker/**", "package*.json", ".github/workflows/reinman-ci.yml"]
  pull_request:
    paths: ["engine/**", "web/**", "worker/**", "package*.json", ".github/workflows/reinman-ci.yml"]
# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: reinman-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  # One job, not two: GitHub bills each job rounded up to a whole minute and each job pays
  # its own setup. Only the suites whose code changed run (GitHub Actions minutes budget,
  # see docs/ACTIONS_BUDGET.md); a change to this file or package files runs everything.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: changed
        with:
          filters: |
            engine:
              - 'engine/**'
              - '.github/workflows/reinman-ci.yml'
            web:
              - 'web/**'
              - 'worker/**'
              - 'package*.json'
              - '.github/workflows/reinman-ci.yml'
      # ---- engine (Python) ----
      - if: steps.changed.outputs.engine == 'true'
        uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engine/pyproject.toml }
      - if: steps.changed.outputs.engine == 'true'
        working-directory: engine
        run: pip install -e ".[dev]" && pytest -q
      # ---- web + Worker (TypeScript) ----
      - if: steps.changed.outputs.web == 'true'
        uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - if: steps.changed.outputs.web == 'true'
        run: npm ci && npm run typecheck && npm test && npm run build
      # The browser download is cached by Playwright version; only its system libraries install each run.
      - if: steps.changed.outputs.web == 'true'
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.web == 'true'
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - if: steps.changed.outputs.web == 'true' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.changed.outputs.web == 'true' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - if: steps.changed.outputs.web == 'true'
        run: npx playwright test --config web/playwright.config.ts --trace off
