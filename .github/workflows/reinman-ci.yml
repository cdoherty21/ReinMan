name: reinman-ci
on:
  push:
    paths: ["engine/**", "web/**", "worker/**", "docs/**", "package*.json", ".github/workflows/reinman-*.yml"]
  pull_request:
    paths: ["engine/**", "web/**", "worker/**", "docs/**", "package*.json", ".github/workflows/reinman-*.yml"]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: engine } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engine/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: pytest -q
  web-worker:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: . } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
