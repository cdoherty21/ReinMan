# Rein Man: continuous learning. Trains a candidate on all graded history, validates it
# out-of-sample against the champion, promotes only if it wins; then a walk-forward backtest.
name: reinman-learn
on:
  workflow_dispatch:
    inputs:
      force:
        description: Train even if a model was trained in the last 24 hours
        type: boolean
        default: false
  # The Worker also starts learning on Mondays; this daily schedule keeps it current.
  schedule:
    - cron: "53 10 * * *"
concurrency:
  group: reinman-db-writer
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  learn:
    # Scheduled runs stay off until the repository variable REINMAN_ENABLED is "true"
    # (set it once the racing-data secrets exist). Manual runs always work.
    if: github.event_name == 'workflow_dispatch' || vars.REINMAN_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults: { run: { working-directory: engine } }
    env:
      REINMAN_DB: d1
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: engine/pyproject.toml }
      - run: pip install -e .
      - run: reinman train ${{ inputs.force && '--force' || '' }}
      - run: reinman backtest
